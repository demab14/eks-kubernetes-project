name: Build and Deploy to EKS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: enterprise-cluster
  IMAGE_REPO: demab/eks-app
  RELEASE_NAME: eks-project

permissions:
  contents: read

jobs:
  validate:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm-chart

      - name: Validate rendered manifests with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template "$RELEASE_NAME" ./helm-chart > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml hpa.yaml

      - name: Build image (no push)
        run: docker build -t "$IMAGE_REPO:${{ github.sha }}" .

  deploy:
    name: Build, push and deploy
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # required for AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm-chart \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Apply Horizontal Pod Autoscaler
        run: kubectl apply -f hpa.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/eks-project --timeout=180s
          kubectl get pods,svc,hpa -o wide
